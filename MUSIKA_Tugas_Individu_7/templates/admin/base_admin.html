<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Admin MUSIKA{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand fw-bold" href="{{ url_for('admin_dashboard') }}">MUSIKA <span class="text-secondary">| ADMIN</span></a><div class="d-flex gap-3"><a class="text-white text-decoration-none" href="{{ url_for('home') }}">Lihat Website</a><a class="text-white text-decoration-none" href="{{ url_for('products') }}">Katalog</a></div></div></nav><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h3 mb-1">{% block heading %}Dashboard Admin{% endblock %}</h1><p class="text-secondary mb-0">Pengelolaan katalog MUSIKA Legacy</p></div></div>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} alert-dismissible fade show" role="alert">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
